[theme]
primaryColor = "#4ecdc4"
backgroundColor = "#0f0c29"
secondaryBackgroundColor = "#1a1a4a"
textColor = "#ffffff"
font = "sans serif"

[server]
maxUploadSize = 10
enableCORS = false
enableXsrfProtection = true
maxMessageSize = 200

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false

[logger]
level = "info"
